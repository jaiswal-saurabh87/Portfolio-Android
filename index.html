<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#080808" />

  <title>Download Portfolio App</title>

  <!-- Metropolis Font -->
  <link
    href="https://fonts.cdnfonts.com/css/metropolis-2"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      color-scheme: light dark;

      --background: #080808;
      --text: #ffffff;
      --muted: #999999;
      --button-bg: #ffffff;
      --button-text: #080808;
      --shadow: rgba(255, 255, 255, 0.15);
    }

    /* Automatic Light Theme */
    @media (prefers-color-scheme: light) {
      :root {
        --background: #f5f5f5;
        --text: #111111;
        --muted: #666666;
        --button-bg: #111111;
        --button-text: #ffffff;
        --shadow: rgba(0, 0, 0, 0.15);
      }
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Metropolis", sans-serif;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(128, 128, 128, 0.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(128, 128, 128, 0.08),
          transparent 30%
        ),
        var(--background);

      color: var(--text);

      overflow: hidden;

      transition:
        background 0.4s ease,
        color 0.4s ease;
    }

    .container {
      width: min(90%, 600px);

      text-align: center;

      padding: 40px;

      animation: fadeUp 0.9s ease forwards;
    }

    h1 {
      font-size: clamp(38px, 7vw, 68px);

      font-weight: 800;

      letter-spacing: -2.5px;

      margin-bottom: 18px;
    }

    .subtitle {
      max-width: 500px;

      margin: 0 auto 36px;

      color: var(--muted);

      font-size: 16px;

      line-height: 1.7;

      font-weight: 400;
    }

    /* Download Button */

    .download-btn {
      position: relative;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      min-width: 220px;

      padding: 17px 30px;

      border: none;

      border-radius: 14px;

      background: var(--button-bg);

      color: var(--button-text);

      font-family: inherit;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      overflow: hidden;

      box-shadow:
        0 12px 35px var(--shadow);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.4s ease,
        color 0.4s ease;
    }

    /* Animated shine */

    .download-btn::before {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 80%;
      height: 100%;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.55),
        transparent
      );

      transform: skewX(-20deg);

      animation: shine 3s infinite;
    }

    .download-btn:hover {
      transform: translateY(-4px) scale(1.02);

      box-shadow:
        0 18px 50px var(--shadow);
    }

    .download-btn:active {
      transform: translateY(0) scale(0.96);
    }

    .download-icon {
      position: relative;
      z-index: 1;

      width: 20px;
      height: 20px;

      animation: downloadBounce 1.5s ease-in-out infinite;
    }

    .button-text {
      position: relative;
      z-index: 1;
    }

    .version {
      margin-top: 18px;

      color: var(--muted);

      opacity: 0.65;

      font-size: 11px;

      letter-spacing: 0.5px;
    }

    /* Focus accessibility */

    .download-btn:focus-visible {
      outline: 3px solid currentColor;
      outline-offset: 5px;
    }

    /* Animations */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      0% {
        left: -120%;
      }

      45%,
      100% {
        left: 140%;
      }
    }

    @keyframes downloadBounce {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(3px);
      }
    }

    /* Mobile */

    @media (max-width: 600px) {
      .container {
        padding: 25px;
      }

      h1 {
        font-size: clamp(36px, 12vw, 52px);

        letter-spacing: -1.8px;
      }

      .subtitle {
        font-size: 14px;

        line-height: 1.6;
      }

      .download-btn {
        width: 100%;

        max-width: 280px;
      }
    }

    /* Reduce animation for accessibility */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Portfolio App</h1>

    <p class="subtitle">
      Explore my work, projects, skills and achievements
      through my personal portfolio application.
    </p>

    <button
      class="download-btn"
      onclick="downloadApp()"
      aria-label="Download Portfolio App"
    >

      <!-- Download Icon -->
      <svg
        class="download-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 3v12"></path>
        <path d="m7 10 5 5 5-5"></path>
        <path d="M5 21h14"></path>
      </svg>

      <span class="button-text">
        Download App
      </span>

    </button>

    <div class="version">
      Portfolio App · Latest Version
    </div>

  </main>

  <script>
    function downloadApp() {

      // Place your APK URL here
      const apkURL = "base.apk";

      const link = document.createElement("a");

      link.href = apkURL;
      link.download = "Portfolio-App.apk";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);
    }
  </script>

</body>
</html>
